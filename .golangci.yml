# .golangci.yml
version: "2"

run:
  timeout: 5m
  go: "1.21"
  tests: true
  build-tags: []
  allow-parallel-runners: true

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    # Core linters
    - bodyclose
    - durationcheck
    - goconst
    - gocritic
    - gocyclo
    - lll
    - misspell
    - prealloc
    - predeclared
    - unconvert
    - unparam
    - whitespace
    # Additional linters
    - asasalint
    - bidichk
    - contextcheck
    - decorder
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - makezero
    - nilnil
    - tparallel

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow

  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 2
    min-occurrences: 3

  lll:
    line-length: 120

  revive:
    enable-all-rules: false
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: package-comments
        severity: warning
      - name: error-naming
        severity: warning
      - name: context-as-argument
        severity: warning

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  exhaustive:
    check-generated: false
    default-signifies-exhaustive: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
  exclude:
    - "avoid meaningless package names"

  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - goconst
    - path: pkg/logger/
      linters:
        - lll
    - path: internal/types/branch\.go
      linters:
        - revive

    # Exclude known false positives
    - text: "G104:"
      linters:
        - gosec
    - text: "G204:"
      linters:
        - gosec
    - text: "var-naming: avoid meaningless package names"
      linters:
        - revive
